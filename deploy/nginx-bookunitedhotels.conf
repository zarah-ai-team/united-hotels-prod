# nginx site config for bookunitedhotels.com — Next.js (web-next) edition.
#
# Replaces the old static-SPA config. Everything (pages, the /api BFF, and
# /api/pricing) is proxied to the Next app on 127.0.0.1:3000. Do NOT add a
# separate `location /api -> :5000` here: that would bypass the BFF and break
# pricing (/api/pricing only exists inside Next). The Next BFF is what reaches
# Express (:5000) and the pricing engine (:5050) server-side.
#
# Install:
#   sudo cp deploy/nginx-bookunitedhotels.conf /etc/nginx/sites-available/bookunitedhotels.com
#   sudo ln -sf /etc/nginx/sites-available/bookunitedhotels.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# IMPORTANT: confirm the ssl_certificate paths below match your Certbot certs
# (`sudo certbot certificates`). The www server block needs the cert to cover
# www.bookunitedhotels.com (Certbot usually issues both).

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name bookunitedhotels.com www.bookunitedhotels.com;
    return 301 https://bookunitedhotels.com$request_uri;
}

# www -> non-www (canonical)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.bookunitedhotels.com;

    ssl_certificate     /etc/letsencrypt/live/bookunitedhotels.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bookunitedhotels.com/privkey.pem;

    return 301 https://bookunitedhotels.com$request_uri;
}

# Main site -> Next.js
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bookunitedhotels.com;

    ssl_certificate     /etc/letsencrypt/live/bookunitedhotels.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bookunitedhotels.com/privkey.pem;
    # Keep these two only if the files exist (Certbot creates them):
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Hotel imagery / form uploads headroom.
    client_max_body_size 25m;

    # Compress proxied text responses (Next also gzips, this is belt-and-braces).
    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # Long-cache Next's content-hashed assets.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Everything else (pages, /api BFF, /api/pricing, robots, sitemap, icons).
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 60s;
    }
}
